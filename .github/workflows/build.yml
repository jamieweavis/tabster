name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    # Package.swift targets macOS 26, which needs Xcode 26.
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install just
        uses: extractions/setup-just@v3

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Cache SoundFont
        uses: actions/cache@v4
        with:
          path: Resources/Bundle/SoundFont.sf2
          key: soundfont-generaluser-gs-2.0.3

      - name: Lint
        run: just lint

      - name: Test
        run: just test

      - name: Test Swift
        run: just test-swift

      # Builds the bindings, the Swift shell and the bundle; CI has no signing identity, so sign ad hoc.
      - name: Build app
        env:
          TABSTER_SIGN_IDENTITY: "-"
        run: just app

  release-pr:
    if: ${{ github.event_name == 'push' && github.repository_owner == 'jamieweavis' }}
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - &checkout-release-plz
        name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
          token: ${{ secrets.RELEASE_PLZ_TOKEN }}

      - &install-rust
        name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Open release PR
        uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}

  release:
    if: ${{ github.event_name == 'push' && github.repository_owner == 'jamieweavis' }}
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    outputs:
      created: ${{ steps.release-plz.outputs.releases_created }}
      tag: ${{ fromJSON(steps.release-plz.outputs.releases || '[{}]')[0].tag }}
      version: ${{ fromJSON(steps.release-plz.outputs.releases || '[{}]')[0].version }}
    steps:
      - *checkout-release-plz

      - *install-rust

      - name: Create release
        id: release-plz
        uses: release-plz/action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}

  package-macos:
    needs: release
    if: ${{ needs.release.outputs.created == 'true' }}
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install just
        uses: extractions/setup-just@v3

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Cache SoundFont
        uses: actions/cache@v4
        with:
          path: Resources/Bundle/SoundFont.sf2
          key: soundfont-generaluser-gs-2.0.3

      # No signing identity on CI, so sign ad hoc (the README tells users how to get past Gatekeeper).
      - name: Build dmg
        env:
          CONFIG: release
          TABSTER_SIGN_IDENTITY: "-"
        run: just dmg

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dmg="build/Tabster-${{ needs.release.outputs.version }}-macos-arm64.dmg"
          gh release upload "${{ needs.release.outputs.tag }}" "$dmg" "$dmg.sha256"

  publish:
    needs: [release, package-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${{ needs.release.outputs.tag }}" --repo "${{ github.repository }}" --draft=false --latest
