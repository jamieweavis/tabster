[package]
name = "tabster"
edition.workspace = true
version.workspace = true
publish.workspace = true

# The Rust core. The Swift shell links it as libtabster_core.a.
[lib]
name = "tabster_core"
crate-type = ["lib", "staticlib"]

[dependencies]
log = "0.4.35"
notify = { version = "8.2.2", default-features = false, features = ["macos_fsevent"] }
oslog = { version = "0.2.0", default-features = false, features = ["logger"] }
parking_lot = "0.13.0"
postcard = { version = "1.1.3", features = ["use-std"] }
quick-xml = "0.42.0"
rayon = "1.12.0"
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
tiny_http = "0.12.0"
toml = "1.2.1"
uniffi.workspace = true
zip = { version = "9.4.2", default-features = false, features = ["deflate"] }

[dev-dependencies]
criterion = "0.8.2"
insta = "1.49.0"
proptest = "1.12.0"
tempfile = "3.27.0"

[workspace]
resolver = "3"
members = ["tools/uniffi-bindgen"]

[workspace.package]
edition = "2024"
version = "0.1.0"
publish = false

[workspace.dependencies]
uniffi = "0.32"

[profile.release]
lto = "thin"
codegen-units = 1
